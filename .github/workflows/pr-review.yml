# Review automática de PRs con @claude (motor PRINCIPAL — suscripción Max)
# Copiar a:  .github/workflows/pr-review.yml
# Requiere el secret del repo:  CLAUDE_CODE_OAUTH_TOKEN
#   (generar una vez con:  claude setup-token  — usa tu cupo Max, se reinicia cada mes)
# Guía completa:  docs/ci-cd/free-pr-review.md
# Fallback gratis:  docs/ci-cd/pr-review.workflow.yml  (NVIDIA NIM)
name: PR Review (@claude)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# `synchronize` fires on every push to an open PR, so addressing gate feedback
# with three quick commits used to start three reviews of three diffs, two of
# them already superseded. Grouped per PR and cancelling: what matters is a
# review of the FINAL diff. This protects the Max quota, not just Actions
# minutes - a cancelled run still costs whatever it already spent, but far less
# than reviewing every intermediate state to completion.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  id-token: write

jobs:
  claude-review:
    # No revisa borradores (ahorra cupo Max)
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20   # R3: the default is 360 - a model review of a diff never needs it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Publicar el review es parte del trabajo, no un efecto secundario: sin la herramienta
          # para comentar, el job corría, salía limpio y no dejaba nada (#510).
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          prompt: |
            Revisa este pull request como un senior engineer. Enfócate en:
            - Bugs y errores de lógica
            - Seguridad (secrets expuestos, inyección, validación de entrada)
            - Buenas prácticas y mantenibilidad
            - Cobertura de tests faltante
            Responde en español, con feedback accionable y concreto. Sé breve;
            si el PR está bien, dilo en una línea en vez de inventar problemas.

            OBLIGATORIO — publicar el review es parte de la tarea:
            publica tu resultado como comentario del PR con
            `gh pr comment ${{ github.event.pull_request.number }} --body "<tu review>"`,
            y que la PRIMERA línea del cuerpo sea exactamente:
            <!-- [abios-review] claude-review -->
            Publica SIEMPRE, también cuando no encuentres nada — en ese caso una sola
            línea diciendo que no hay hallazgos. Un run que no publica nada no es un
            review sin hallazgos: es un review que no ocurrió, y se trata como fallo.

      # El arreglo de fondo de #510: un reviewer que no revisó debe ponerse ROJO. Antes, este job
      # salía en verde sin haber dejado nada, y ese verde se leía como "revisado y aprobado" -
      # justo cuando era el UNICO reviewer del repo (Copilot sin cupo).
      - name: Verificar que el review realmente se publicó
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n='${{ github.event.pull_request.number }}'
          reviews=$(gh pr view "$n" --json reviews --jq '[.reviews[]] | length')
          marks=$(gh pr view "$n" --json comments --jq '[.comments[] | select(.body | test("\\[abios-review\\]"))] | length')
          echo "reviews=$reviews  comentarios [abios-review]=$marks"
          if [ "$reviews" -eq 0 ] && [ "$marks" -eq 0 ]; then
            echo "::error::claude-review terminó sin dejar ningún review. Un check verde aquí se leería como 'revisado' cuando nadie miró el código (#510)."
            exit 1
          fi
